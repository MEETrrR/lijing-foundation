openapi: 3.1.0
info:
  title: Lijing API
  version: 1.0.0
  description: Versioned use-case contract for the Lijing learning platform.
  license:
    name: Lijing internal product contract
    identifier: Lijing-Internal-Contract
servers:
  - url: https://api.example.invalid
    description: Reserved documentation host; deployment hosts are environment-specific.
tags:
  - name: platform
    description: Platform health and request context operations.
  - name: identity
    description: Account registration and session operations.
  - name: learning
    description: Server-authoritative learning and progress operations.
  - name: memory
    description: User-controlled learning memory and iteration operations.
  - name: profile
    description: User-owned profile and recoverable client state operations.
  - name: ai
    description: AI Gateway mediated learning assistance operations.
paths:
  /api/v1/health:
    get:
      tags: [platform]
      operationId: getHealth
      summary: Check API health
      security: []
      responses:
        '200':
          description: Service health summary without infrastructure credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/register:
    post:
      tags: [identity]
      operationId: registerAccount
      summary: Register a learner account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and session cookie issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/login:
    post:
      tags: [identity]
      operationId: loginAccount
      summary: Start a learner session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session cookie issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/logout:
    post:
      tags: [identity]
      operationId: logoutAccount
      summary: Revoke the current learner session
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Current session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      tags: [identity]
      operationId: getCurrentAccount
      summary: Read the current learner account
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Current account profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/progress:
    get:
      tags: [learning]
      operationId: getMyProgress
      summary: Read my learning progress
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current server-owned progress projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/memories:
    get:
      tags: [memory]
      operationId: getMyMemories
      summary: Read my learning memories
      security:
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [global, goal-exam, goal-skill, goal-life]
      responses:
        '200':
          description: User-controlled memory projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/knowledge/sources:
    get:
      tags: [knowledge]
      operationId: getOfficialKnowledgeSources
      summary: Read the official RAG source registry
      security:
        - bearerAuth: []
      parameters:
        - name: goal_type
          in: query
          required: false
          schema:
            type: string
            enum: [postgraduate_entrance_exam, civil_service_exam, employment, professional_certificate, personal_growth]
      responses:
        '200':
          description: Official sources available to the retrieval index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSourceRegistryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/knowledge/search:
    get:
      tags: [knowledge]
      operationId: searchOfficialKnowledge
      summary: Search reviewed official knowledge chunks for grounding
      security:
        - bearerAuth: []
      parameters:
        - name: goal_type
          in: query
          required: true
          schema:
            type: string
            enum: [postgraduate_entrance_exam, civil_service_exam, employment, professional_certificate, personal_growth]
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 1200
        - name: region
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
      responses:
        '200':
          description: Reviewed retrieval results with source provenance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/me/state:
    get:
      tags: [profile]
      operationId: getMyState
      summary: Read recoverable user state
      description: Reads the authenticated learner's profile, preferences, knowledge nodes, and recoverable learning view state.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User-scoped state projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [profile]
      operationId: saveMyState
      summary: Save recoverable user state
      description: Saves only allowlisted user-owned state. Server-authoritative learning settlement remains on the learning endpoints.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStateRequest'
      responses:
        '200':
          description: User state saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStateResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/feedback:
    post:
      tags: [profile]
      operationId: submitFeedback
      summary: Submit authenticated product feedback
      description: Stores feedback under the authenticated learner and accepts safe retries through idempotency.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Feedback received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/me/reminders:
    get:
      tags: [profile]
      operationId: getMyReminders
      summary: Read due learning reminders
      description: Returns the authenticated learner's local reminder window and today's open plan tasks.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reminder projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/companion:
    get:
      tags: [profile]
      operationId: getMyCompanionProfile
      summary: Read the authenticated learner's companion continuity profile
      description: Returns server-recorded companion interactions and prompt version without exposing conversation text.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Companion continuity profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/learning/attempts:
    post:
      tags: [learning]
      operationId: recordLearningAttempt
      summary: Record and evaluate a learning attempt
      description: The server-authoritative use case evaluates the submitted intent and settles learning state after validation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - request_id
                - attempt_id
                - question_id
                - answer
                - action
              properties:
                request_id:
                  type: string
                  format: uuid
                attempt_id:
                  type: string
                  minLength: 1
                  maxLength: 100
                question_id:
                  type: string
                  minLength: 1
                  maxLength: 100
                answer:
                  type: string
                  minLength: 1
                  maxLength: 1000
                action:
                  type: string
                  enum: [submit]
      responses:
        '201':
          description: Evaluated attempt and server-settled result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningAttemptResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/memory/iterations:
    post:
      tags: [memory]
      operationId: recordMemoryIteration
      summary: Record a learning iteration and create memory candidates
      description: Derives user-controlled memory candidates from submitted evidence and a review result. Candidates remain unconfirmed until the learner accepts them.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryIterationRequest'
      responses:
        '201':
          description: Learning iteration recorded and memory candidates returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryIterationResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/me/memories/{memory_id}:
    post:
      tags: [memory]
      operationId: updateMyMemory
      summary: Confirm, reject, or edit a learning memory
      security:
        - bearerAuth: []
      parameters:
        - name: memory_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryFeedbackRequest'
      responses:
        '200':
          description: Updated learner memory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryFeedbackResponse'
        '404':
          description: Memory was not found for the authenticated learner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/learning-routes/sources:
    get:
      tags: [learning]
      operationId: getLearningRouteSources
      summary: Read the official-source registry used for route drafts
      security:
        - bearerAuth: []
      parameters:
        - name: goal_type
          in: query
          required: false
          schema:
            type: string
            enum: [postgraduate_entrance_exam, civil_service_exam, employment, professional_certificate, personal_growth]
      responses:
        '200':
          description: Official-source registry for supported route domains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningRouteSourceRegistryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/learning-routes:
    get:
      tags: [learning]
      operationId: getMyLearningRoute
      summary: Read my latest learning route draft or confirmed route
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Latest draft or confirmed route for the authenticated learner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningRouteLatestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [learning]
      operationId: generateLearningRouteDraft
      summary: Generate a source-bound learning route draft
      description: The server validates the AI draft, calculates capacity from user-declared time, and never treats dynamic public facts as confirmed without a source check.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningRouteDraftRequest'
      responses:
        '200':
          description: Structured draft or an explicit AI-degraded result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningRouteGenerationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/AiRateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/learning-routes/{route_id}/confirm:
    post:
      tags: [learning]
      operationId: confirmLearningRouteDraft
      summary: Confirm a feasible learning route draft
      security:
        - bearerAuth: []
      parameters:
        - name: route_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^route-[0-9a-fA-F-]{36}$'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningRouteConfirmationRequest'
      responses:
        '200':
          description: The confirmed, versioned route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningRouteConfirmationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/learning-routes/{route_id}/refresh:
    post:
      tags: [learning]
      operationId: refreshLearningRoutePlan
      summary: Apply learning evidence to the current plan
      description: Updates today's executable plan from completed or skipped task evidence and keeps the route versioned.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: route_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^route-[0-9a-fA-F-]{36}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningRouteRefreshRequest'
      responses:
        '200':
          description: Updated route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningRouteConfirmationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/ai/requests:
    post:
      tags: [ai]
      operationId: submitAiUseCase
      summary: Submit an AI Gateway use case
      description: All model access is mediated by the server AI Gateway, which applies policy, quota, audit, and output validation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - request_id
                - feature
                - input
              properties:
                request_id:
                  type: string
                  format: uuid
                feature:
                  type: string
                  enum:
                    - concept_explanation
                    - wrong_answer_hint
                    - study_plan_suggestion
                    - learning_route_generation
                    - progress_query
                    - emotional_support
                input:
                  type: string
                  minLength: 1
                  maxLength: 16000
                image_object_ids:
                  type: array
                  maxItems: 2
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
      responses:
        '202':
          description: Accepted for synchronous or asynchronous AI Gateway processing; rejection is represented by 422 or 429.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRequestProcessingResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/AiRateLimited'
        '422':
          $ref: '#/components/responses/AiPolicyRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/ai/requests/{request_id}:
    get:
      tags: [ai]
      operationId: getAiRequest
      summary: Read the state of an AI Gateway request
      description: Poll an accepted AI Gateway request using the server-owned request state and result contract.
      security:
        - bearerAuth: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current server-owned AI Gateway request state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated retry key scoped by actor, route, and operation family.
      schema:
        type: string
        minLength: 16
        maxLength: 128
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, ai_configured, request_id]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        request_id:
          type: string
          format: uuid
        ai_configured:
          type: boolean
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 128
        display_name:
          type: string
          maxLength: 80
        invite_code:
          type: string
          minLength: 1
          maxLength: 256
          description: Required when the deployment enables closed-pilot registration.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 128
    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name, created_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        created_at:
          type: [string, 'null']
          format: date-time
    AuthResponse:
      type: object
      additionalProperties: false
      required: [user, request_id]
      properties:
        user:
          $ref: '#/components/schemas/User'
        request_id:
          type: string
          format: uuid
    ProgressResponse:
      type: object
      additionalProperties: false
      required: [request_id, account_level, mastery_summary, energy]
      properties:
        request_id:
          type: string
          format: uuid
        account_level:
          type: integer
          minimum: 1
        mastery_summary:
          type: object
          additionalProperties: false
          required: [mastered, review_due]
          properties:
            mastered:
              type: integer
              minimum: 0
            review_due:
              type: integer
              minimum: 0
        energy:
          type: object
          additionalProperties: false
          required: [current, maximum]
          properties:
            current:
              type: integer
              minimum: 0
            maximum:
              type: integer
              minimum: 0
    LearningAttemptResponse:
      type: object
      additionalProperties: false
      required: [request_id, attempt_id, evaluation, settlement]
      properties:
        request_id:
          type: string
          format: uuid
        attempt_id:
          type: string
        evaluation:
          type: object
          additionalProperties: false
          required: [correct, content_version]
          properties:
            correct:
              type: boolean
              readOnly: true
            content_version:
              type: string
              readOnly: true
        settlement:
          type: object
          additionalProperties: false
          required: [mastery_state, reward_summary, energy]
          properties:
            mastery_state:
              type: string
              readOnly: true
            reward_summary:
              $ref: '#/components/schemas/RewardSummary'
              readOnly: true
            energy:
              $ref: '#/components/schemas/EnergySettlement'
              readOnly: true
    Memory:
      type: object
      additionalProperties: false
      required: [id, kind, title, content, scope, goal_title, source, status, confidence, observation_count, evidence_level, first_observed_at, last_observed_at, last_iteration_id, updated_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [friction, strategy]
        title:
          type: string
        content:
          type: string
        scope:
          type: string
          enum: [global, goal-exam, goal-skill, goal-life]
        goal_title:
          type: string
        source:
          type: string
          enum: [learning_iteration]
        status:
          type: string
          enum: [candidate, active, rejected]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        observation_count:
          type: integer
          minimum: 1
        evidence_level:
          type: integer
          minimum: 1
          maximum: 4
        first_observed_at:
          type: string
          format: date-time
        last_observed_at:
          type: string
          format: date-time
        last_iteration_id:
          type: string
        updated_at:
          type: string
          format: date-time
          readOnly: true
    MemoryProfileResponse:
      type: object
      additionalProperties: false
      required: [request_id, memories, iteration_count]
      properties:
        request_id:
          type: string
          format: uuid
        memories:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        iteration_count:
          type: integer
          minimum: 0
    CompanionProfileResponse:
      type: object
      additionalProperties: false
      required: [request_id, version, companion_id, prompt_version, interaction_count, first_seen_at, last_seen_at, last_request_id, last_topic, recent_topics]
      properties:
        request_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        companion_id:
          type: string
        prompt_version:
