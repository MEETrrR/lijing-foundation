openapi: 3.1.0
info:
  title: Lijing API
  version: 1.0.0
  description: Versioned use-case contract for the Lijing learning platform.
servers:
  - url: https://api.example.invalid
    description: Reserved documentation host; deployment hosts are environment-specific.
tags:
  - name: platform
  - name: learning
  - name: ai
paths:
  /api/v1/health:
    get:
      tags: [platform]
      operationId: getHealth
      responses:
        '200':
          description: Service health summary without infrastructure credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/me/progress:
    get:
      tags: [learning]
      operationId: getMyProgress
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current server-owned progress projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/learning/attempts:
    post:
      tags: [learning]
      operationId: recordLearningAttempt
      description: The server-authoritative use case evaluates the submitted intent and settles learning state after validation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - request_id
                - attempt_id
                - question_id
                - answer
              properties:
                request_id:
                  type: string
                  format: uuid
                attempt_id:
                  type: string
                  minLength: 1
                  maxLength: 100
                question_id:
                  type: string
                  minLength: 1
                  maxLength: 100
                answer:
                  type: string
                  minLength: 1
                  maxLength: 1000
                action:
                  type: string
                  enum: [submit]
      responses:
        '201':
          description: Evaluated attempt and server-settled result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningAttemptResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/ai/requests:
    post:
      tags: [ai]
      operationId: submitAiUseCase
      description: All model access is mediated by the server AI Gateway, which applies policy, quota, audit, and output validation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - request_id
                - feature
                - input
              properties:
                request_id:
                  type: string
                  format: uuid
                feature:
                  type: string
                  enum:
                    - concept_explanation
                    - wrong_answer_hint
                    - study_plan_suggestion
                    - progress_query
                    - emotional_support
                input:
                  type: string
                  minLength: 1
                  maxLength: 16000
                image_object_ids:
                  type: array
                  maxItems: 2
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
      responses:
        '202':
          description: Accepted for synchronous or asynchronous AI Gateway processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRequestResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated retry key scoped by actor, route, and operation family.
      schema:
        type: string
        minLength: 16
        maxLength: 128
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, request_id]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        request_id:
          type: string
          format: uuid
    ProgressResponse:
      type: object
      additionalProperties: false
      required: [request_id, account_level, mastery_summary, energy]
      properties:
        request_id:
          type: string
          format: uuid
        account_level:
          type: integer
          minimum: 1
        mastery_summary:
          type: object
          additionalProperties: false
          required: [mastered, review_due]
          properties:
            mastered:
              type: integer
              minimum: 0
            review_due:
              type: integer
              minimum: 0
        energy:
          type: object
          additionalProperties: false
          required: [current, maximum]
          properties:
            current:
              type: integer
              minimum: 0
            maximum:
              type: integer
              minimum: 0
    LearningAttemptResponse:
      type: object
      additionalProperties: false
      required: [request_id, attempt_id, evaluation, settlement]
      properties:
        request_id:
          type: string
          format: uuid
        attempt_id:
          type: string
        evaluation:
          type: object
          additionalProperties: false
          required: [correct, content_version]
          properties:
            correct:
              type: boolean
              readOnly: true
            content_version:
              type: string
              readOnly: true
        settlement:
          type: object
          additionalProperties: false
          required: [mastery_state, reward_summary, energy]
          properties:
            mastery_state:
              type: string
              readOnly: true
            reward_summary:
              type: object
              readOnly: true
            energy:
              type: object
              readOnly: true
    AiRequestResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, policy_version]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, queued, completed, degraded, rejected]
        policy_version:
          type: string
        result:
          type: object
          additionalProperties: false
          properties:
            text:
              type: string
            source_type:
              type: string
              enum: [system_course, reviewed_content, ai_assisted, user_upload, mixed]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [request_id, code, message, retryable]
      properties:
        request_id:
          type: string
          format: uuid
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: The intent is malformed, out of bounds, or not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: The idempotency key was already used with a different request fingerprint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: A policy, quota, concurrency, or budget gate rejected the request.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
