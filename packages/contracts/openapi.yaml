          items:
            type: string
            pattern: '^plan-day-\\d{4}-\\d{2}-\\d{2}$'
        available_minutes:
          type: integer
          minimum: 0
          maximum: 1440
    LearningRouteConfirmationResponse:
      type: object
      additionalProperties: false
      required: [request_id, route, replayed]
      properties:
        request_id:
          type: string
          format: uuid
        route:
          $ref: '#/components/schemas/LearningRoute'
        replayed:
          type: boolean
    AiRequestResponse:
      type: object
      oneOf:
        - $ref: '#/components/schemas/AiRequestAcceptedResponse'
        - $ref: '#/components/schemas/AiRequestQueuedResponse'
        - $ref: '#/components/schemas/AiRequestCompletedResponse'
        - $ref: '#/components/schemas/AiRequestDegradedResponse'
        - $ref: '#/components/schemas/AiRequestRejectedResponse'
      discriminator:
        propertyName: status
        mapping:
          accepted: '#/components/schemas/AiRequestAcceptedResponse'
          queued: '#/components/schemas/AiRequestQueuedResponse'
          completed: '#/components/schemas/AiRequestCompletedResponse'
          degraded: '#/components/schemas/AiRequestDegradedResponse'
          rejected: '#/components/schemas/AiRequestRejectedResponse'
    AiRequestProcessingResponse:
      type: object
      oneOf:
        - $ref: '#/components/schemas/AiRequestAcceptedResponse'
        - $ref: '#/components/schemas/AiRequestQueuedResponse'
        - $ref: '#/components/schemas/AiRequestCompletedResponse'
        - $ref: '#/components/schemas/AiRequestDegradedResponse'
      discriminator:
        propertyName: status
        mapping:
          accepted: '#/components/schemas/AiRequestAcceptedResponse'
          queued: '#/components/schemas/AiRequestQueuedResponse'
          completed: '#/components/schemas/AiRequestCompletedResponse'
          degraded: '#/components/schemas/AiRequestDegradedResponse'
    AiRequestAcceptedResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, policy_version]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          const: accepted
        policy_version:
          type: string
    AiRequestQueuedResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, policy_version, poll_after_seconds]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          const: queued
        policy_version:
          type: string
        poll_after_seconds:
          type: integer
          minimum: 1
    AiRequestCompletedResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, policy_version, result]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          const: completed
        policy_version:
          type: string
        result:
          $ref: '#/components/schemas/AiResult'
    AiRequestDegradedResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, policy_version, fallback_mode]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          const: degraded
        policy_version:
          type: string
        fallback_mode:
          type: string
          enum: [template, cached, low_cost_model, async_queue]
    AiRequestRejectedResponse:
      type: object
      oneOf:
        - $ref: '#/components/schemas/AiRequestPolicyRejectedResponse'
        - $ref: '#/components/schemas/AiRequestRateLimitedResponse'
      discriminator:
        propertyName: rejection_class
        mapping:
          policy: '#/components/schemas/AiRequestPolicyRejectedResponse'
          rate_limit: '#/components/schemas/AiRequestRateLimitedResponse'
    AiRequestPolicyRejectedResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, rejection_class, policy_version, reason_code]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          const: rejected
        rejection_class:
          const: policy
        policy_version:
          type: string
        reason_code:
          type: string
          minLength: 1
          maxLength: 100
    AiRequestRateLimitedResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, rejection_class, policy_version, reason_code, retry_after_seconds]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          const: rejected
        rejection_class:
          const: rate_limit
        policy_version:
          type: string
        reason_code:
          type: string
          minLength: 1
          maxLength: 100
        retry_after_seconds:
          type: integer
          minimum: 1
    AiResult:
      type: object
      additionalProperties: false
      required: [text, source_type]
      properties:
        text:
          type: string
        source_type:
          type: string
          enum: [system_course, reviewed_content, ai_assisted, user_upload, mixed]
    RewardSummary:
      type: object
      additionalProperties: false
      required: [experience, coins, item_ids]
      properties:
        experience:
          type: integer
          minimum: 0
        coins:
          type: integer
          minimum: 0
        item_ids:
          type: array
          items:
            type: string
        title_granted:
          type: string
    EnergySettlement:
      type: object
      additionalProperties: false
      required: [current, maximum, delta]
      properties:
        current:
          type: integer
          minimum: 0
        maximum:
          type: integer
          minimum: 0
        delta:
          type: integer
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [request_id, code, message, retryable]
      properties:
        request_id:
          type: string
          format: uuid
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
  responses:
    NotFound:
      description: The requested resource was not found for the authenticated actor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated actor is not allowed to use this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: The intent is malformed, out of bounds, or not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: The idempotency key was already used with a different request fingerprint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AiPolicyRejected:
      description: The AI Gateway rejected the request because policy or input validation did not permit processing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiRequestPolicyRejectedResponse'
    AiRateLimited:
      description: The AI Gateway rejected the request because a rate, concurrency, quota, or budget limit was reached.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiRequestRateLimitedResponse'
    DependencyUnavailable:
      description: A required dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    sessionCookie:
      type: apiKey
      in: cookie
      name: lijing_session
