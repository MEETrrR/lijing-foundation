name: verify

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run contract checks
        run: pnpm contract:lint
      - name: Run platform checks
        run: pnpm platform:test
      - name: Run client checks
        run: pnpm client:test
      - name: Run AI pilot checks
        run: pnpm client:ai:test
      - name: Run asset checks
        run: pnpm image:test
      - name: Check JavaScript syntax
        shell: bash
        run: find apps packages services tools tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Check patch formatting
        run: git diff --check
